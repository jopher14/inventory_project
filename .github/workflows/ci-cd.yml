name: Django CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  # ==========================================
  # JOB 1: CONTINUOUS INTEGRATION (CI)
  # Runs tests & linter on all PRs & pushes
  # ==========================================
  test:
    name: Run Linter & Django Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Code Quality Checks (Ruff)
        run: |
          # Run Ruff linter against project codebase
          ruff check .
          # Verify formatting matches Ruff style standard
          ruff format --check .

      - name: Run Django Migrations & Tests
        env:
          SECRET_KEY: "ci-secret-key-testing-only"
          GITHUB_ACTIONS: "true"
        run: |
          python manage.py makemigrations --check
          python manage.py test

  # ==========================================
  # JOB 2: CONTINUOUS DEPLOYMENT (CD)
  # Automatically deploys code to local host
  # ==========================================
  deploy:
    name: Deploy to Local Network Host
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Execute SSH Commands on Local Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /path/to/your/django-asset-inventory
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt
            python manage.py migrate
            python manage.py collectstatic --noinput
            sudo systemctl restart gunicorn  # Or restart your system service / supervisor
