name: Django CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  # ==========================================
  # JOB 1: CONTINUOUS INTEGRATION (CI)
  # Runs tests & linter on all PRs & pushes
  # ==========================================
  test:
    name: Run Linter & Django Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r requirements.txt

      - name: Run Ruff Linter & Format Check
        run: |
          ruff check .
          ruff format --check .

      - name: Run Django Unit Tests
        env:
          SECRET_KEY: "test-secret-key-for-ci"
        run: |
          python manage.py test

  # ==========================================
  # JOB 2: CONTINUOUS DEPLOYMENT (CD)
  # Triggers automatic deploy on Render.com
  # ==========================================
  deploy-render:
    name: Trigger Render Deployment
    needs: test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
