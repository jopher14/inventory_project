services:
  - type: web
    name: django-inventory-app
    env: python
    plan: starter
    buildCommand: "./build.sh"
    startCommand: "gunicorn inventory_project.wsgi:application"

    disk:
      name: inventory-media
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

      - key: DEBUG
        value: "False"

      - key: MEDIA_ROOT
        value: /var/data/media

      - key: WEB_CONCURRENCY
        value: "4"

databases:
  - name: inventory-db
    databaseName: inventory_db
    user: inventory_user
